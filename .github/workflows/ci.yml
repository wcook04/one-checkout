name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.13'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo.py
      - run: python scripts/check_layout.py --root .
      - name: Install both self-contained skills
        run: |
          python scripts/install.py --agent both --scope project --project "$RUNNER_TEMP"
          python "$RUNNER_TEMP/.agents/skills/one-checkout/scripts/one_checkout.py" --help
          python "$RUNNER_TEMP/.claude/skills/one-checkout/scripts/one_checkout.py" --help
