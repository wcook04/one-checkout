name: Check
on: [push, pull_request, workflow_dispatch]
permissions: {}
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: ubuntu-24.04
            python: '3.15'
          - os: macos-15
            python: '3.13'
          - os: macos-15
            python: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate fixtures and record versions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/one-checkout/home" "$RUNNER_TEMP/one-checkout/tmp" "$RUNNER_TEMP/one-checkout/install"
          {
            echo "HOME=$RUNNER_TEMP/one-checkout/home"
            echo "TMPDIR=$RUNNER_TEMP/one-checkout/tmp"
            echo "ONE_CHECKOUT_TEST_TMPDIR=$RUNNER_TEMP/one-checkout/tmp"
          } >> "$GITHUB_ENV"
          python --version
          git --version
      - run: python -B -I -m unittest discover -s tests -v
      - run: python -B -I scripts/demo.py --human --compare-git
      - name: Check working and staged layout
        run: |
          python -B -I scripts/check_layout.py --root .
          python -B -I scripts/check_layout.py --root . --index
      - name: Install both self-contained skills
        run: |
          python -B -I scripts/install.py --agent both --scope project --project "$RUNNER_TEMP/one-checkout/install"
          python -B -I "$RUNNER_TEMP/one-checkout/install/.agents/skills/one-checkout/scripts/doctor.py" --self-test
          python -B -I "$RUNNER_TEMP/one-checkout/install/.claude/skills/one-checkout/scripts/doctor.py" --self-test
      - run: python -B -I scripts/try_install.py --human
      - run: python -B -I scripts/compare_workflows.py --repeats 1
      - name: Exercise native Git backends
        if: matrix.python == '3.13'
        run: |
          python -B -I scripts/check_backends.py --scratch "$TMPDIR" --output "$RUNNER_TEMP/backends.json"
          cat "$RUNNER_TEMP/backends.json"
      - name: Assert source remains clean
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  quality:
    name: Workflow and Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned development checks
        run: python -m pip install --disable-pip-version-check ruff==0.17.0 zizmor==1.30.1
      - run: ruff check --no-cache --select E9,F63,F7,F82 .
      - run: zizmor --offline --no-progress .github/workflows
      - name: Verify and run actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
